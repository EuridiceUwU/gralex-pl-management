name: gralex-pl-management

services:
  database:
    build:
      context: ./Database
    image: gralex-pl-database:local
    container_name: gralex-pl-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gralex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gralex}
      POSTGRES_DB: ${POSTGRES_DB:-gralex_db}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - gralex-network
    ports:
      - "5433:5432"

  backend:
    build:
      context: ./Backend
    image: gralex-pl/backend:local
    container_name: gralex-pl-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-gralex}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-gralex}
      DB_NAME: ${POSTGRES_DB:-gralex_db}
    depends_on:
      - database
    networks:
      - gralex-network
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./Frontend
    image: gralex-pl/frontend:local
    container_name: gralex-pl-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - gralex-network
    ports:
      - "4200:80"

  nginx:
    build:
      context: ./Nginx
    image: gralex-pl/nginx:local
    container_name: gralex-pl-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    networks:
      - gralex-network
    ports:
      - "80:80"

  minio:
    build:
      context: ./Minio
    image: gralex-pl/minio:local
    container_name: gralex-pl-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gralex}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-gralex}
    volumes:
      - minio_data:/data
    networks:
      - gralex-network
    ports:
      - "9000:9000"
      - "9101:9001"

  prometheus:
    build:
      context: ./Prometheus
    image: gralex-pl/prometheus:local
    container_name: gralex-pl-prometheus
    restart: unless-stopped
    volumes:
      - prometheus_data:/prometheus
    networks:
      - gralex-network
    ports:
      - "9090:9090"

  grafana:
    build:
      context: ./Grafana
    image: gralex-pl/grafana:local
    container_name: gralex-pl-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - gralex-network
    ports:
      - "3001:3000"

networks:
  gralex-network:
    driver: bridge

volumes:
  db_data:
  minio_data:
  prometheus_data:
  grafana_data:

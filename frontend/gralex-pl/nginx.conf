server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx's default mime.types has no .mjs mapping; serve ES module files
    # (e.g. the pdf.js worker) with a JS MIME type so module/worker loading
    # passes the browser's strict MIME check.
    location ~* \.mjs$ {
        default_type text/javascript;
        try_files $uri =404;
    }

    # Hashed build assets: cache hard and return a real 404 if missing. This
    # must NOT fall back to index.html — otherwise a stale/missing JS chunk is
    # served as HTML and the browser rejects it ("MIME type text/html"), which
    # breaks lazy-loaded routes after every redeploy.
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|map)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, so the browser always picks up the chunk
    # hashes from the latest build instead of requesting ones that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Angular client-side routing: fall back to index.html for real navigations.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

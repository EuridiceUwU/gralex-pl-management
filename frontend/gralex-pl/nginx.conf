server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx's default mime.types has no .mjs mapping; serve ES module files
    # (e.g. the pdf.js worker) with a JS MIME type so module/worker loading
    # passes the browser's strict MIME check.
    location ~* \.mjs$ {
        default_type text/javascript;
        try_files $uri =404;
    }

    # Angular client-side routing: always fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

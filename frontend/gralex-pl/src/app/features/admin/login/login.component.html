<div class="grid min-h-screen md:grid-cols-2">
  <!-- Brand panel -->
  <div class="relative hidden flex-col justify-between bg-brand-500 p-12 text-white md:flex">
    <a routerLink="/" class="flex items-center gap-2 text-2xl font-extrabold">
      <span class="grid h-10 w-10 place-items-center rounded-xl bg-white/20">G</span>
      Gralex
    </a>
    <div>
      <h2 class="text-3xl font-bold leading-tight">Panel administrativo</h2>
      <p class="mt-4 max-w-sm text-brand-100">
        Gestiona guías, clientes, proveedores y métricas de tu operación en un solo lugar.
      </p>
    </div>
    <p class="text-sm text-brand-100">© 2026 Gralex</p>
  </div>

  <!-- Form -->
  <div class="flex items-center justify-center bg-slate-50 p-8">
    <form #f="ngForm" (ngSubmit)="submit()" class="w-full max-w-sm rounded-2xl border border-slate-100 bg-white p-8 shadow-sm">
      <h1 class="text-2xl font-bold">Iniciar sesión</h1>
      <p class="mt-1 text-sm text-slate-500">Accede con tu cuenta de administrador.</p>

      @if (error()) {
        <div class="mt-6 rounded-lg bg-red-50 px-4 py-3 text-sm font-medium text-red-700">
          {{ error() }}
        </div>
      }

      <label class="mt-6 block text-sm font-medium text-slate-700">Correo</label>
      <input
        name="email"
        type="email"
        #emailRef="ngModel"
        [(ngModel)]="email"
        required
        email
        class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-2.5 outline-none transition focus:border-brand-500 focus:ring-2 focus:ring-brand-100"
      />
      <app-field-error [field]="emailRef" />

      <label class="mt-4 block text-sm font-medium text-slate-700">Contraseña</label>
      <input
        name="password"
        type="password"
        #passwordRef="ngModel"
        [(ngModel)]="password"
        required
        minlength="6"
        class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-2.5 outline-none transition focus:border-brand-500 focus:ring-2 focus:ring-brand-100"
      />
      <app-field-error [field]="passwordRef" />

      <button
        type="submit"
        [disabled]="loading() || f.invalid"
        class="mt-8 w-full rounded-xl bg-brand-500 py-3 font-semibold text-white transition hover:bg-brand-600 disabled:opacity-60"
      >
        {{ loading() ? 'Entrando…' : 'Entrar' }}
      </button>

      <a routerLink="/" class="mt-4 block text-center text-sm text-slate-500 hover:text-brand-600">
        ← Volver al inicio
      </a>
    </form>
  </div>
</div>

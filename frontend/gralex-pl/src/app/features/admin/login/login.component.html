<div class="grid min-h-screen md:grid-cols-[1.1fr_1fr]">
  <!-- Brand image panel -->
  <div class="relative hidden overflow-hidden md:block">
    <img
      src="/login-hero.jpg"
      alt="Logística Gralex: transporte aéreo, terrestre y envíos globales"
      class="absolute inset-0 h-full w-full object-cover"
    />
    <!-- Sutil realce de marca en el borde inferior -->
    <div class="absolute inset-0 bg-gradient-to-t from-brand-900/25 to-transparent"></div>
  </div>

  <!-- Form -->
  <div class="flex items-center justify-center bg-white p-8">
    <form
      #f="ngForm"
      (ngSubmit)="submit()"
      autocomplete="off"
      style="zoom: 1.25"
      class="w-full max-w-sm"
    >
      <img
        src="/logo-gralex-pl.png"
        alt="GrAlex PL"
        class="mx-auto h-40 w-auto"
      />

      <h1 class="mt-8 text-center text-2xl font-bold text-slate-800">Iniciar sesión</h1>
      <p class="mt-1 text-center text-sm text-slate-500">Accede con tu cuenta de administrador.</p>

      @if (error()) {
        <div class="mt-6 rounded-lg bg-red-50 px-4 py-3 text-sm font-medium text-red-700">
          {{ error() }}
        </div>
      }

      <label class="mt-8 flex items-center gap-2 text-sm font-semibold text-slate-700">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="h-4 w-4 text-brand-600"
        >
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
        Usuario
      </label>
      <input
        name="email"
        type="email"
        #emailRef="ngModel"
        [(ngModel)]="email"
        required
        email
        autocomplete="off"
        placeholder="usuario@gralex.com"
        class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-2.5 outline-none transition placeholder:text-slate-400 focus:border-brand-500 focus:ring-2 focus:ring-brand-100"
      />
      <app-field-error [field]="emailRef" />

      <label class="mt-4 flex items-center gap-2 text-sm font-semibold text-slate-700">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="h-4 w-4 text-brand-600"
        >
          <rect x="3" y="11" width="18" height="11" rx="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
        Contraseña
      </label>
      <div class="relative mt-2">
        <input
          name="password"
          [type]="showPassword() ? 'text' : 'password'"
          #passwordRef="ngModel"
          [(ngModel)]="password"
          required
          minlength="6"
          autocomplete="new-password"
          placeholder="••••••••"
          class="w-full rounded-xl border border-slate-200 px-4 py-2.5 pr-11 outline-none transition placeholder:text-slate-400 focus:border-brand-500 focus:ring-2 focus:ring-brand-100"
        />
        <button
          type="button"
          (click)="showPassword.set(!showPassword())"
          [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          [attr.aria-pressed]="showPassword()"
          class="absolute inset-y-0 right-0 grid w-11 place-items-center text-slate-400 transition hover:text-brand-600"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="h-5 w-5"
          >
            @if (showPassword()) {
              <!-- ojo tachado -->
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19" />
              <path d="M6.61 6.61A18.5 18.5 0 0 0 2 12s3 8 10 8a9.12 9.12 0 0 0 5.39-1.61" />
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
              <line x1="2" y1="2" x2="22" y2="22" />
            } @else {
              <!-- ojo abierto -->
              <path d="M2 12s3-8 10-8 10 8 10 8-3 8-10 8-10-8-10-8Z" />
              <circle cx="12" cy="12" r="3" />
            }
          </svg>
        </button>
      </div>
      <app-field-error [field]="passwordRef" />

      <button
        type="submit"
        [disabled]="loading() || f.invalid"
        class="mt-8 w-full rounded-xl bg-brand-500 py-3 font-semibold text-white transition hover:bg-brand-600 disabled:opacity-60"
      >
        {{ loading() ? 'Entrando…' : 'Iniciar sesión' }}
      </button>

      <a routerLink="/" class="mt-4 block text-center text-sm text-slate-500 transition hover:text-brand-600">
        ← Volver al inicio
      </a>
    </form>
  </div>
</div>

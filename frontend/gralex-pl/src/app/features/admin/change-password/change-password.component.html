<div class="flex min-h-screen items-center justify-center bg-slate-50 p-8">
  <form
    #f="ngForm"
    (ngSubmit)="submit()"
    autocomplete="off"
    class="w-full max-w-sm rounded-2xl bg-white p-8 shadow-sm"
  >
    <img src="/logo-gralex-pl.png" alt="GrAlex PL" class="mx-auto h-28 w-auto" />

    <h1 class="mt-6 text-center text-2xl font-bold text-slate-800">Cambia tu contraseña</h1>
    <p class="mt-1 text-center text-sm text-slate-500">
      Por seguridad, define una nueva contraseña antes de continuar.
    </p>

    @if (error()) {
      <div class="mt-6 rounded-lg bg-red-50 px-4 py-3 text-sm font-medium text-red-700">
        {{ error() }}
      </div>
    }

    <label class="mt-8 block text-sm font-semibold text-slate-700">Nueva contraseña</label>
    <div class="relative mt-2">
      <input
        name="newPassword"
        [type]="showPassword() ? 'text' : 'password'"
        #newRef="ngModel"
        [(ngModel)]="newPassword"
        required
        minlength="6"
        maxlength="72"
        autocomplete="new-password"
        placeholder="••••••••"
        class="w-full rounded-xl border border-slate-200 px-4 py-2.5 pr-11 outline-none transition placeholder:text-slate-400 focus:border-brand-500 focus:ring-2 focus:ring-brand-100"
      />
      <button
        type="button"
        (click)="showPassword.set(!showPassword())"
        [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        [attr.aria-pressed]="showPassword()"
        class="absolute inset-y-0 right-0 grid w-11 place-items-center text-slate-400 transition hover:text-brand-600"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5">
          @if (showPassword()) {
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19" />
            <path d="M6.61 6.61A18.5 18.5 0 0 0 2 12s3 8 10 8a9.12 9.12 0 0 0 5.39-1.61" />
            <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
            <line x1="2" y1="2" x2="22" y2="22" />
          } @else {
            <path d="M2 12s3-8 10-8 10 8 10 8-3 8-10 8-10-8-10-8Z" />
            <circle cx="12" cy="12" r="3" />
          }
        </svg>
      </button>
    </div>
    <app-field-error [field]="newRef" />

    <label class="mt-4 block text-sm font-semibold text-slate-700">Confirmar contraseña</label>
    <input
      name="confirmPassword"
      [type]="showPassword() ? 'text' : 'password'"
      #confirmRef="ngModel"
      [(ngModel)]="confirmPassword"
      required
      minlength="6"
      maxlength="72"
      autocomplete="new-password"
      placeholder="••••••••"
      class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-2.5 outline-none transition placeholder:text-slate-400 focus:border-brand-500 focus:ring-2 focus:ring-brand-100"
    />
    <app-field-error [field]="confirmRef" />

    <button
      type="submit"
      [disabled]="loading() || f.invalid"
      class="mt-8 w-full rounded-xl bg-brand-500 py-3 font-semibold text-white transition hover:bg-brand-600 disabled:opacity-60"
    >
      {{ loading() ? 'Guardando…' : 'Guardar y continuar' }}
    </button>
  </form>
</div>

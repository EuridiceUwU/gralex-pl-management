<div class="flex items-center justify-between">
  <div>
    <h2 class="text-2xl font-bold">Clientes</h2>
    <p class="text-sm text-slate-500">Directorio de clientes.</p>
  </div>
  <button (click)="showForm.set(!showForm())" class="rounded-xl bg-brand-500 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-brand-600">
    {{ showForm() ? 'Cerrar' : '+ Nuevo cliente' }}
  </button>
</div>

@if (showForm()) {
  <form #f="ngForm" (ngSubmit)="save()" class="mt-6 grid gap-4 rounded-2xl border border-slate-100 bg-white p-6 shadow-sm md:grid-cols-3">
    <label class="text-sm"><span class="font-medium text-slate-700">Nombre</span>
      <input name="name" #nameRef="ngModel" [(ngModel)]="form.name" required minlength="3" maxlength="50" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2" />
      <app-field-error [field]="nameRef" /></label>
    <label class="text-sm"><span class="font-medium text-slate-700">Empresa</span>
      <input name="companyName" #companyRef="ngModel" [(ngModel)]="form.companyName" maxlength="50" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2" />
      <app-field-error [field]="companyRef" /></label>
    <label class="text-sm"><span class="font-medium text-slate-700">Email</span>
      <input name="email" type="email" #emailRef="ngModel" [(ngModel)]="form.email" required email maxlength="254" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2" />
      <app-field-error [field]="emailRef" /></label>
    <label class="text-sm"><span class="font-medium text-slate-700">Teléfono</span>
      <input name="phone" phoneMask #phoneRef="ngModel" [(ngModel)]="form.phone" required pattern="\d{10}" placeholder="271-230-4713" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2" />
      <app-field-error [field]="phoneRef" patternMessage="Deben ser 10 dígitos." /></label>
    <label class="text-sm"><span class="font-medium text-slate-700">RFC</span>
      <input name="rfc" #rfcRef="ngModel" [(ngModel)]="form.rfc" minlength="12" maxlength="13" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2" />
      <app-field-error [field]="rfcRef" /></label>
    <label class="text-sm"><span class="font-medium text-slate-700">CP</span>
      <input name="cp" #cpRef="ngModel" [(ngModel)]="form.cp" pattern="\d{5}" maxlength="5" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2" />
      <app-field-error [field]="cpRef" patternMessage="Deben ser 5 dígitos." /></label>
    <div class="md:col-span-3">
      <button type="submit" [disabled]="saving() || f.invalid" class="rounded-xl bg-brand-500 px-6 py-2.5 text-sm font-semibold text-white transition hover:bg-brand-600 disabled:opacity-60">
        {{ saving() ? 'Guardando…' : 'Guardar' }}
      </button>
    </div>
  </form>
}

<div class="mt-6 overflow-hidden rounded-2xl border border-slate-100 bg-white shadow-sm">
  @if (loading()) {
    <p class="p-6 text-slate-500">Cargando…</p>
  } @else {
    <table class="w-full text-left text-sm">
      <thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-500">
        <tr><th class="px-4 py-3">Nombre</th><th class="px-4 py-3">Empresa</th><th class="px-4 py-3">Email</th><th class="px-4 py-3">Teléfono</th></tr>
      </thead>
      <tbody class="divide-y divide-slate-100">
        @for (c of items(); track c.customer_id) {
          <tr class="transition hover:bg-slate-50">
            <td class="px-4 py-3 font-medium text-slate-800">{{ c.name }}</td>
            <td class="px-4 py-3">{{ c.company_name || '—' }}</td>
            <td class="px-4 py-3">{{ c.email || '—' }}</td>
            <td class="px-4 py-3">{{ c.phone || '—' }}</td>
          </tr>
        } @empty {
          <tr><td colspan="4" class="px-4 py-8 text-center text-slate-400">Sin clientes.</td></tr>
        }
      </tbody>
    </table>
  }
</div>

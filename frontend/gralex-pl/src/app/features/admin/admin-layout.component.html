<div class="flex min-h-screen bg-slate-50">
  <!-- Sidebar -->
  <aside class="hidden w-64 flex-col border-r border-slate-200 bg-white md:flex">
    <div class="flex items-center gap-2 px-6 py-5 text-xl font-extrabold">
      <span class="grid h-9 w-9 place-items-center rounded-xl bg-brand-500 text-white">G</span>
      Gralex
    </div>
    <nav class="flex-1 space-y-1 px-3 py-4">
      @for (item of nav; track item.path) {
        @if (!item.adminOnly || auth.isAdmin()) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-brand-50 text-brand-700 font-semibold"
          class="flex items-center gap-3 rounded-xl px-4 py-2.5 text-sm font-medium text-slate-600 transition hover:bg-slate-100"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="h-5 w-5 shrink-0"
          >
            @switch (item.icon) {
              @case ('dashboard') {
                <rect x="3" y="3" width="7" height="9" rx="1" />
                <rect x="14" y="3" width="7" height="5" rx="1" />
                <rect x="14" y="12" width="7" height="9" rx="1" />
                <rect x="3" y="16" width="7" height="5" rx="1" />
              }
              @case ('package') {
                <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z" />
                <path d="m3.3 7 8.7 5 8.7-5" />
                <path d="M12 22V12" />
              }
              @case ('upload') {
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <path d="M17 8l-5-5-5 5" />
                <path d="M12 3v12" />
              }
              @case ('users') {
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" />
                <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
                <path d="M16 3.13a4 4 0 0 1 0 7.75" />
              }
              @case ('truck') {
                <path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2" />
                <path d="M15 18H9" />
                <path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62l-3.48-4.35A1 1 0 0 0 17.52 8H14" />
                <circle cx="7" cy="18" r="2" />
                <circle cx="17" cy="18" r="2" />
              }
              @case ('badge') {
                <circle cx="12" cy="8" r="5" />
                <path d="M20 21a8 8 0 0 0-16 0" />
              }
              @case ('history') {
                <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
                <path d="M3 3v5h5" />
                <path d="M12 7v5l4 2" />
              }
            }
          </svg>
          {{ item.label }}
        </a>
        }
      }
    </nav>
    <button
      (click)="logout()"
      class="m-3 flex items-center gap-3 rounded-xl px-4 py-2.5 text-left text-sm font-medium text-slate-600 transition hover:bg-red-50 hover:text-red-600"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="h-5 w-5 shrink-0"
      >
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <path d="M16 17l5-5-5-5" />
        <path d="M21 12H9" />
      </svg>
      Cerrar sesión
    </button>
  </aside>

  <!-- Main -->
  <div class="flex min-w-0 flex-1 flex-col">
    <header class="flex items-center justify-between border-b border-slate-200 bg-white px-6 py-4">
      <h1 class="text-lg font-semibold text-slate-800">Panel administrativo</h1>
      <div class="flex items-center gap-3">
        <span class="text-sm text-slate-500">{{ auth.user()?.name }}</span>
        <span class="grid h-9 w-9 place-items-center rounded-full bg-brand-100 font-bold text-brand-700">
          {{ (auth.user()?.name ?? 'A').charAt(0) }}
        </span>
      </div>
    </header>

    <main class="flex-1 overflow-auto p-6">
      <router-outlet />
    </main>
  </div>
</div>

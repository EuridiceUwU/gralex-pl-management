<div class="flex items-center justify-between">
  <div>
    <h2 class="text-2xl font-bold">Empleados</h2>
    <p class="text-sm text-slate-500">Equipo y accesos al panel.</p>
  </div>
  <button (click)="showForm.set(!showForm())" class="rounded-xl bg-brand-500 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-brand-600">
    {{ showForm() ? 'Cerrar' : '+ Nuevo empleado' }}
  </button>
</div>

@if (showForm()) {
  <form #f="ngForm" (ngSubmit)="save()" class="mt-6 grid gap-4 rounded-2xl border border-slate-100 bg-white p-6 shadow-sm md:grid-cols-3">
    <label class="text-sm"><span class="font-medium text-slate-700">Nombre</span>
      <input name="name" #nameRef="ngModel" [(ngModel)]="form.name" required minlength="3" maxlength="30" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2" />
      <app-field-error [field]="nameRef" /></label>
    <label class="text-sm"><span class="font-medium text-slate-700">Rol</span>
      <select name="roleId" #roleRef="ngModel" [(ngModel)]="form.roleId" required class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2">
        <option [ngValue]="null" disabled>Selecciona…</option>
        @for (r of roles(); track r.role_id) {
          <option [ngValue]="r.role_id">{{ r.role_name }}</option>
        }
      </select>
      <app-field-error [field]="roleRef" /></label>
    <label class="text-sm"><span class="font-medium text-slate-700">Email</span>
      <input name="email" type="email" #emailRef="ngModel" [(ngModel)]="form.email" required email maxlength="254" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2" />
      <app-field-error [field]="emailRef" /></label>
    <label class="text-sm"><span class="font-medium text-slate-700">Teléfono</span>
      <input name="phone" phoneMask #phoneRef="ngModel" [(ngModel)]="form.phone" required pattern="\d{10}" placeholder="271-230-4713" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2" />
      <app-field-error [field]="phoneRef" patternMessage="Deben ser 10 dígitos." /></label>
    <label class="text-sm"><span class="font-medium text-slate-700">Contraseña (acceso opcional)</span>
      <input name="password" type="password" #passwordRef="ngModel" [(ngModel)]="form.password" minlength="6" maxlength="72" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2" />
      <app-field-error [field]="passwordRef" /></label>
    <div class="md:col-span-3">
      <button type="submit" [disabled]="saving() || f.invalid" class="rounded-xl bg-brand-500 px-6 py-2.5 text-sm font-semibold text-white transition hover:bg-brand-600 disabled:opacity-60">
        {{ saving() ? 'Guardando…' : 'Guardar' }}
      </button>
    </div>
  </form>
}

<div class="mt-6 overflow-hidden rounded-2xl border border-slate-100 bg-white shadow-sm">
  @if (loading()) {
    <p class="p-6 text-slate-500">Cargando…</p>
  } @else {
    <table class="w-full text-left text-sm">
      <thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-500">
        <tr><th class="px-4 py-3">Nombre</th><th class="px-4 py-3">Rol</th><th class="px-4 py-3">Email</th><th class="px-4 py-3">Teléfono</th></tr>
      </thead>
      <tbody class="divide-y divide-slate-100">
        @for (e of items(); track e.employee_id) {
          <tr class="transition hover:bg-slate-50">
            <td class="px-4 py-3 font-medium text-slate-800">{{ e.name }}</td>
            <td class="px-4 py-3"><span class="rounded-full bg-brand-50 px-2.5 py-1 text-xs font-medium text-brand-700">{{ e.role_name }}</span></td>
            <td class="px-4 py-3">{{ e.email || '—' }}</td>
            <td class="px-4 py-3">{{ e.phone || '—' }}</td>
          </tr>
        } @empty {
          <tr><td colspan="4" class="px-4 py-8 text-center text-slate-400">Sin empleados.</td></tr>
        }
      </tbody>
    </table>
  }
</div>

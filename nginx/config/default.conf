upstream gralex_frontend {
    server frontend:80;
}

upstream gralex_backend {
    server backend:3000;
}

upstream gralex_ocr {
    server ocr:8000;
}

server {
    listen 80 default_server;
    server_name _;

    # Liveness probe used by the Dockerfile HEALTHCHECK.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Allow larger uploads (guías as PDF/images go through here).
    client_max_body_size 20m;

    # Friendly shortcut to the Swagger/OpenAPI docs served by the backend
    # (swagger-ui-express at /api-docs). Real path is proxied below via /api/.
    location = /docs {
        return 301 /api/api-docs/;
    }

    # Backend API. Docs are reachable at /api/api-docs (Swagger UI + spec).
    location /api/ {
        proxy_pass         http://gralex_backend/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }

    # OCR microservice (direct access for testing; the app normally calls it
    # through the backend at /api/documents/ocr).
    location /ocr/ {
        proxy_pass         http://gralex_ocr/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Everything else -> Angular frontend
    location / {
        proxy_pass         http://gralex_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}